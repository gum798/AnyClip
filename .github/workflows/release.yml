name: Release

# Build + publish AnyClip when a v* tag is pushed.
# - macos job: builds .app -> .dmg, signs with Sparkle's sign_update.
# - windows job: builds .exe (one-folder zipped), signs with Python
#   ed25519 against the same private key (WinSparkle understands the
#   same EdDSA signature format).
# - appcast job: runs after both build jobs, renders appcast.xml with
#   both enclosures into a single <item>, and pushes to gh-pages so
#   the Sparkle and WinSparkle feeds stay in lockstep.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  SPARKLE_VERSION: "2.6.4"
  WINSPARKLE_VERSION: "0.8.3"

jobs:
  macos:
    name: macOS arm64 build
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run pytest
        run: pytest tests/ -v

      - name: Download Sparkle.framework
        run: |
          set -e
          curl -L -o Sparkle.tar.xz \
            "https://github.com/sparkle-project/Sparkle/releases/download/${SPARKLE_VERSION}/Sparkle-${SPARKLE_VERSION}.tar.xz"
          mkdir -p sparkle
          tar -xJf Sparkle.tar.xz -C sparkle
          echo "SPARKLE_FRAMEWORK_PATH=$(pwd)/sparkle/Sparkle.framework" >> "$GITHUB_ENV"
          echo "SPARKLE_BIN_DIR=$(pwd)/sparkle/bin" >> "$GITHUB_ENV"

      - name: Build .app with py2app
        env:
          SPARKLE_PUBLIC_KEY: ${{ secrets.SPARKLE_PUBLIC_KEY }}
          # Strip leading "v" from the tag so Sparkle's semver
          # comparison sees "0.9.0-rc1" not "v0.9.0-rc1".
          ANYCLIP_BUILD_VERSION: ${{ github.ref_name == 'main' && '0.0.0-dev' || github.ref_name }}
        run: |
          export ANYCLIP_BUILD_VERSION="${ANYCLIP_BUILD_VERSION#v}"
          # Monotonic build number for Sparkle's comparison key.
          # Captured once here so the same value reaches setup.py
          # (CFBundleVersion) and the appcast renderer below.
          BUILD_NUMBER=$(date -u +%s)
          export ANYCLIP_BUILD_NUMBER="$BUILD_NUMBER"
          echo "ANYCLIP_BUILD_NUMBER=$BUILD_NUMBER" >> "$GITHUB_ENV"
          echo "Building version: $ANYCLIP_BUILD_VERSION (build $BUILD_NUMBER)"
          python setup.py py2app

      - name: Package .dmg via hdiutil
        run: |
          mkdir -p dist/dmg-root
          cp -R dist/AnyClip.app dist/dmg-root/
          hdiutil create \
            -volname AnyClip \
            -srcfolder dist/dmg-root \
            -ov -format UDZO \
            "dist/AnyClip-${{ github.ref_name }}.dmg"

      - name: Sign .dmg with sign_update (EdDSA)
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          set -e
          echo "$SPARKLE_PRIVATE_KEY" > /tmp/sparkle_ed_priv
          "$SPARKLE_BIN_DIR/sign_update" \
            -f /tmp/sparkle_ed_priv \
            "dist/AnyClip-${{ github.ref_name }}.dmg" \
            > dist/macos-signature.txt
          rm -f /tmp/sparkle_ed_priv
          cat dist/macos-signature.txt

      - name: Upload macOS asset to Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/AnyClip-${{ github.ref_name }}.dmg
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true

      - name: Save build number for appcast job
        run: echo "${{ env.ANYCLIP_BUILD_NUMBER }}" > dist/build-number.txt

      - name: Persist macOS metadata for appcast job
        uses: actions/upload-artifact@v4
        with:
          name: macos-release
          path: |
            dist/AnyClip-${{ github.ref_name }}.dmg
            dist/macos-signature.txt
            dist/build-number.txt

  windows:
    name: Windows x64 build
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install cryptography

      - name: Run pytest
        run: pytest tests/ -v

      - name: Download WinSparkle
        shell: pwsh
        run: |
          $ws = "WinSparkle-${env:WINSPARKLE_VERSION}"
          $url = "https://github.com/vslavik/winsparkle/releases/download/v${env:WINSPARKLE_VERSION}/${ws}.zip"
          Invoke-WebRequest -Uri $url -OutFile WinSparkle.zip
          Expand-Archive -Path WinSparkle.zip -DestinationPath winsparkle -Force
          # PyInstaller datas: copy WinSparkle.dll next to our package
          # so the runtime sys._MEIPASS resolution finds it.
          $dll = Get-ChildItem -Path winsparkle -Recurse -Filter "WinSparkle.dll" | Where-Object { $_.FullName -like "*Release*x64*" } | Select-Object -First 1
          if (-not $dll) {
            $dll = Get-ChildItem -Path winsparkle -Recurse -Filter "WinSparkle.dll" | Select-Object -First 1
          }
          Copy-Item -Path $dll.FullName -Destination app\WinSparkle.dll -Force

      - name: Build .exe with PyInstaller
        env:
          SPARKLE_PUBLIC_KEY: ${{ secrets.SPARKLE_PUBLIC_KEY }}
          ANYCLIP_BUILD_VERSION: ${{ github.ref_name == 'main' && '0.0.0-dev' || github.ref_name }}
        shell: pwsh
        run: |
          # Strip leading "v" so WinSparkle's semver compares cleanly.
          $env:ANYCLIP_BUILD_VERSION = $env:ANYCLIP_BUILD_VERSION -replace '^v',''
          Write-Output "Building version: $env:ANYCLIP_BUILD_VERSION"
          pyinstaller anyclip.spec --noconfirm

      - name: Zip dist
        shell: pwsh
        run: |
          Compress-Archive `
            -Path dist/AnyClip/* `
            -DestinationPath "dist/AnyClip-${{ github.ref_name }}-windows-x64.zip"

      - name: Sign zip with Python ed25519
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        shell: pwsh
        run: |
          python -c "import os, base64, pathlib; from cryptography.hazmat.primitives.asymmetric.ed25519 import Ed25519PrivateKey; priv = Ed25519PrivateKey.from_private_bytes(base64.b64decode(os.environ['SPARKLE_PRIVATE_KEY'])); data = pathlib.Path('dist/AnyClip-${{ github.ref_name }}-windows-x64.zip').read_bytes(); sig = priv.sign(data); pathlib.Path('dist/windows-signature.txt').write_text('sparkle:edSignature=' + chr(34) + base64.b64encode(sig).decode() + chr(34) + ' length=' + chr(34) + str(len(data)) + chr(34))"
          Get-Content dist/windows-signature.txt

      - name: Upload Windows asset to Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/AnyClip-${{ github.ref_name }}-windows-x64.zip
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true

      - name: Persist Windows metadata for appcast job
        uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: |
            dist/AnyClip-${{ github.ref_name }}-windows-x64.zip
            dist/windows-signature.txt

  macos-swift:
    name: macOS native (Swift) build
    # macos-15 = arm64 + Xcode 16 (Swift 6); macos-14 images ship Swift 5.x
    # which cannot build swift-tools-version 6.0.
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run Swift tests
        run: swift test --package-path formacOS

      - name: Build AnyClip.app (Swift)
        env:
          ANYCLIP_BUILD_VERSION: ${{ github.ref_name }}
        run: |
          export ANYCLIP_BUILD_VERSION="${ANYCLIP_BUILD_VERSION#v}"
          formacOS/Scripts/build-app.sh

      - name: Zip .app (Homebrew cask asset)
        run: |
          ditto -c -k --sequesterRsrc --keepParent \
            formacOS/dist/AnyClip.app \
            "formacOS/dist/AnyClip-${{ github.ref_name }}-macos-arm64.zip"
          shasum -a 256 "formacOS/dist/AnyClip-${{ github.ref_name }}-macos-arm64.zip"

      - name: Upload Swift macOS asset to Release
        uses: softprops/action-gh-release@v2
        with:
          files: formacOS/dist/AnyClip-${{ github.ref_name }}-macos-arm64.zip
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true

  appcast:
    name: Publish appcast.xml to gh-pages
    needs: [macos, windows]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download macOS metadata
        uses: actions/download-artifact@v4
        with:
          name: macos-release
          path: dist-macos

      - name: Download Windows metadata
        uses: actions/download-artifact@v4
        with:
          name: windows-release
          path: dist-windows

      - name: Render appcast.xml
        run: |
          python - <<'PYEOF'
          import os
          import pathlib
          import re
          from datetime import datetime, timezone

          tag = os.environ["TAG"]
          version = tag.lstrip("v")
          repo = os.environ["REPO"]  # "owner/name"
          owner, repo_name = repo.split("/", 1)
          pages_url = f"https://{owner}.github.io/{repo_name}/appcast.xml"

          mac_sig_line = pathlib.Path("dist-macos/macos-signature.txt").read_text().strip()
          win_sig_line = pathlib.Path("dist-windows/windows-signature.txt").read_text().strip()
          build_number = pathlib.Path("dist-macos/build-number.txt").read_text().strip()

          pubdate = datetime.now(tz=timezone.utc).strftime("%a, %d %b %Y %H:%M:%S +0000")

          tpl = pathlib.Path("docs/appcast.template.xml").read_text()
          out = (tpl
                 .replace("{{VERSION}}", version)
                 .replace("{{BUILD_NUMBER}}", build_number)
                 .replace("{{TAG}}", tag)
                 .replace("{{REPO}}", repo)
                 .replace("{{PAGES_URL}}", pages_url)
                 .replace("{{PUBDATE}}", pubdate)
                 .replace("{{MAC_SIG_LINE}}", mac_sig_line)
                 .replace("{{WIN_SIG_LINE}}", win_sig_line))
          pathlib.Path("appcast.xml").write_text(out)
          print(out)
          PYEOF
        env:
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}

      - name: Push appcast.xml to gh-pages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          git fetch origin gh-pages || true
          if git show-ref --verify --quiet refs/remotes/origin/gh-pages; then
            git worktree add /tmp/gh-pages origin/gh-pages
          else
            mkdir /tmp/gh-pages
            (cd /tmp/gh-pages && git init -b gh-pages && \
              git remote add origin "https://github.com/${{ github.repository }}.git")
          fi
          cp appcast.xml /tmp/gh-pages/appcast.xml
          (cd /tmp/gh-pages && \
            git config user.email "release-bot@anyclip" && \
            git config user.name "AnyClip Release Bot" && \
            git add appcast.xml && \
            git commit -m "appcast: ${{ github.ref_name }}" && \
            git push "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" HEAD:gh-pages)
