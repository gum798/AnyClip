name: Release

# Build + publish AnyClip when a v* tag is pushed. Sparkle/WinSparkle
# auto-update wiring lives in slice-10/11; this slice ships the raw
# .dmg + .exe assets so users can already download a release.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write  # needed to create + upload to GitHub Releases

jobs:
  macos:
    name: macOS arm64 build
    # macos-14 = Apple Silicon (arm64). Slice scope: arm64 only.
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run pytest
        run: pytest tests/ -v

      - name: Build .app with py2app
        run: |
          # py2app's alias mode pulls in dev paths; `--no-strip` is just
          # the default safer option for first-time builds.
          python setup.py py2app

      - name: Package .dmg via hdiutil
        run: |
          mkdir -p dist/dmg-root
          cp -R dist/AnyClip.app dist/dmg-root/
          hdiutil create \
            -volname AnyClip \
            -srcfolder dist/dmg-root \
            -ov -format UDZO \
            dist/AnyClip-${{ github.ref_name }}.dmg

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/AnyClip-${{ github.ref_name }}.dmg
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true

  windows:
    name: Windows x64 build
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run pytest
        run: pytest tests/ -v

      - name: Build .exe with PyInstaller
        run: pyinstaller anyclip.spec --noconfirm

      - name: Zip dist for upload
        run: |
          Compress-Archive `
            -Path dist/AnyClip/* `
            -DestinationPath dist/AnyClip-${{ github.ref_name }}-windows-x64.zip
        shell: pwsh

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/AnyClip-${{ github.ref_name }}-windows-x64.zip
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
